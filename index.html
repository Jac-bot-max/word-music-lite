<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Word Music Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* --- ANIMAÇÃO GIRASSOL ANDROID --- */
        .sunflower { position: relative; width: 60px; height: 60px; animation: rotate 2s linear infinite; }
        .sunflower div { position: absolute; width: 4px; height: 15px; background: #FFD700; border-radius: 10px; left: 28px; transform-origin: 2px 30px; box-shadow: 0 0 8px #FFD700; }
        .sunflower div:nth-child(1) { transform: rotate(0deg); opacity: 1; }
        .sunflower div:nth-child(2) { transform: rotate(30deg); opacity: 0.9; }
        .sunflower div:nth-child(3) { transform: rotate(60deg); opacity: 0.8; }
        .sunflower div:nth-child(4) { transform: rotate(90deg); opacity: 0.7; }
        .sunflower div:nth-child(5) { transform: rotate(120deg); opacity: 0.6; }
        .sunflower div:nth-child(6) { transform: rotate(150deg); opacity: 0.5; }
        .sunflower div:nth-child(7) { transform: rotate(180deg); opacity: 0.4; }
        .sunflower div:nth-child(8) { transform: rotate(210deg); opacity: 0.3; }
        .sunflower div:nth-child(9) { transform: rotate(240deg); opacity: 0.2; }
        .sunflower div:nth-child(10) { transform: rotate(270deg); opacity: 0.1; }
        .sunflower div:nth-child(11) { transform: rotate(300deg); opacity: 0.1; }
        .sunflower div:nth-child(12) { transform: rotate(330deg); opacity: 0.1; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes textAppear { from { opacity: 0; transform: scale(0.8); filter: blur(10px); } to { opacity: 1; transform: scale(1); filter: blur(0px); } }
        .animate-brand { animation: textAppear 2s ease-out forwards; text-shadow: 0 0 20px #FFD700; }
    </style>
</head>
<body class="bg-black text-white font-sans m-0 p-0 overflow-x-hidden">

    <div id="app"></div>

    <script>
        // --- LIGAÇÃO AO BANCO DE DADOS ---
        const SUPABASE_URL = "https://jyulpbusldlldnxfjqjj.supabase.co"; // Já preenchi com o teu link
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5dWxwYnVzbGRsbGRueGZqcWpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NDQ4MDksImV4cCI6MjA5OTEyMDgwOX0.kzIzhthk8hJv-b0II7qx--AFdusPCenT4oPXrHr7UVg"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const app = document.getElementById('app');
        let currentUser = localStorage.getItem('wm_user') || "";

        function go(page) {
            if (page === 'splash') renderSplash();
            if (page === 'login') renderLogin();
            if (page === 'home') renderHome();
        }

        // 1. SPLASH SCREEN (Girassol + @7viDAS)
        function renderSplash() {
            app.innerHTML = `
                <div class="fixed inset-0 bg-black flex flex-col items-center justify-center z-[999]">
                    <div class="sunflower mb-12">
                        <div></div><div></div><div></div><div></div><div></div><div></div>
                        <div></div><div></div><div></div><div></div><div></div><div></div>
                    </div>
                    <h1 id="b-text" class="text-4xl font-black italic text-[#FFD700] opacity-0">@7viDAS</h1>
                </div>
            `;
            setTimeout(() => document.getElementById('b-text').classList.add('animate-brand'), 1500);
            setTimeout(() => currentUser ? go('home') : go('login'), 5000);
        }

        // 2. LOGIN (Facebook Lite Style)
        function renderLogin() {
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center p-6">
                    <h1 class="text-[#FFD700] text-3xl font-black italic mb-10 text-center">Word Music Lite</h1>
                    <div class="w-full max-w-sm space-y-4">
                        <input id="u-name" type="text" placeholder="Teu Nome Artístico" class="w-full bg-[#1c1c1c] p-4 rounded-md border border-zinc-800 outline-none focus:border-[#D32F2F]">
                        <button onclick="saveLogin()" class="w-full bg-[#D32F2F] text-white font-bold py-3 rounded-md shadow-lg active:scale-95 transition-all">ENTRAR NO RITMO</button>
                    </div>
                </div>
            `;
        }

        function saveLogin() {
            const val = document.getElementById('u-name').value;
            if(val) { localStorage.setItem('wm_user', val); currentUser = val; go('home'); }
        }

        // 3. PÁGINA INICIAL (Feed Real)
        async function renderHome() {
            app.innerHTML = `
                <div class="pb-20">
                    <nav class="sticky top-0 bg-[#1c1c1c] border-b border-zinc-800 flex justify-around p-1 z-50">
                        <button class="p-3 text-[#D32F2F] border-b-2 border-[#D32F2F]">🏠</button>
                        <button class="p-3 text-zinc-500 text-xl">🎞️</button>
                    </nav>

                    <div class="bg-[#1c1c1c] p-4 mt-2">
                        <textarea id="post-input" placeholder="O que vais gravar hoje, ${currentUser}?" class="w-full bg-black text-white p-3 rounded-lg border border-zinc-800 outline-none h-20 text-sm"></textarea>
                        <button onclick="publishPost()" id="btn-pub" class="w-full bg-[#D32F2F] py-2 mt-2 rounded-md font-bold text-sm shadow-md">PUBLICAR NO FEED</button>
                    </div>

                    <div id="feed" class="mt-2 space-y-2">
                        <p class="text-center p-10 text-zinc-600 italic animate-pulse text-sm">A carregar talentos de Moçambique...</p>
                    </div>
                </div>
            `;
            loadPosts();
        }

        async function publishPost() {
            const txt = document.getElementById('post-input').value;
            if(!txt) return;
            document.getElementById('btn-pub').innerText = "A enviar...";
            
            const { error } = await _supabase.from('posts').insert([{ username: currentUser, content: txt }]);
            
            if(!error) { document.getElementById('post-input').value = ""; loadPosts(); }
            document.getElementById('btn-pub').innerText = "PUBLICAR NO FEED";
        }

        async function loadPosts() {
            const { data } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
            const f = document.getElementById('feed');
            if(data) {
                f.innerHTML = data.map(p => `
                    <div class="bg-[#1c1c1c] p-4 border-b border-black">
                        <div class="flex items-center space-x-3 mb-3">
                            <div class="w-10 h-10 bg-red-900 rounded-full flex items-center justify-center font-bold text-xs border border-red-700">7V</div>
                            <div>
                                <p class="font-bold text-sm text-[#FFD700]">${p.username}</p>
                                <p class="text-zinc-600 text-[10px] uppercase font-mono">${new Date(p.created_at).toLocaleTimeString()}</p>
                            </div>
                        </div>
                        <p class="text-sm leading-relaxed">${p.content}</p>
                        <div class="flex justify-between mt-4 border-t border-zinc-800 pt-3 text-zinc-500 text-xs font-bold">
                            <button>🔥 CURTIR</button><button>💬 COMENTAR</button><button>🚀 PARTILHAR</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        go('splash');
    </script>
</body>
</html>
