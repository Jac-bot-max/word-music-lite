<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Word Music Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- ANIMAÇÃO GIRASSOL (ESTILO ANDROID) --- */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sunflower {
            position: relative;
            width: 80px;
            height: 80px;
            animation: rotate 2s linear infinite;
        }

        .sunflower div {
            position: absolute;
            width: 6px;
            height: 20px;
            background: #FFD700;
            border-radius: 10px;
            left: 37px;
            transform-origin: 4px 40px;
            box-shadow: 0 0 10px #FFD700;
        }

        /* Criando as 12 pétalas do girassol */
        .sunflower div:nth-child(1) { transform: rotate(0deg); opacity: 1; }
        .sunflower div:nth-child(2) { transform: rotate(30deg); opacity: 0.8; }
        .sunflower div:nth-child(3) { transform: rotate(60deg); opacity: 0.7; }
        .sunflower div:nth-child(4) { transform: rotate(90deg); opacity: 0.6; }
        .sunflower div:nth-child(5) { transform: rotate(120deg); opacity: 0.5; }
        .sunflower div:nth-child(6) { transform: rotate(150deg); opacity: 0.4; }
        .sunflower div:nth-child(7) { transform: rotate(180deg); opacity: 0.3; }
        .sunflower div:nth-child(8) { transform: rotate(210deg); opacity: 0.2; }
        .sunflower div:nth-child(9) { transform: rotate(240deg); opacity: 0.1; }
        .sunflower div:nth-child(10) { transform: rotate(270deg); opacity: 0.1; }
        .sunflower div:nth-child(11) { transform: rotate(300deg); opacity: 0.1; }
        .sunflower div:nth-child(12) { transform: rotate(330deg); opacity: 0.1; }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* Efeito de Escrita Brilhante */
        @keyframes fadeInText {
            0% { opacity: 0; letter-spacing: 10px; filter: blur(10px); }
            100% { opacity: 1; letter-spacing: 2px; filter: blur(0px); text-shadow: 0 0 20px #FFD700; }
        }

        .animate-text {
            animation: fadeInText 2s ease-out forwards;
        }

        /* Cores Estilo Facebook Lite Dark */
        .bg-fb-black { background-color: #000000; }
        .bg-fb-card { background-color: #1c1c1c; }
        .fb-border { border-color: #2a2a2a; }
    </style>
</head>
<body class="bg-fb-black text-white font-sans m-0 p-0 overflow-x-hidden">

    <div id="app"></div>

    <script>
        const app = document.getElementById('app');

        // Navegação
        function go(page) {
            if (page === 'splash') renderSplash();
            if (page === 'login') renderLogin();
            if (page === 'home') renderHome();
        }

        // 1. TELA DE CARREGAMENTO (ESTILO ANDROID)
        function renderSplash() {
            app.innerHTML = `
                <div class="fixed inset-0 bg-black flex flex-col items-center justify-center z-[999]">
                    <div class="loader-container">
                        <!-- O Girassol / Spinner -->
                        <div class="sunflower mb-10">
                            <div></div><div></div><div></div><div></div>
                            <div></div><div></div><div></div><div></div>
                            <div></div><div></div><div></div><div></div>
                        </div>
                        
                        <!-- O Nome aparecendo -->
                        <h1 id="brand" class="text-4xl font-black italic text-[#FFD700] opacity-0">
                            @7viDAS
                        </h1>
                    </div>
                </div>
            `;

            // Mostrar o nome após 2 segundos de carregamento
            setTimeout(() => {
                const brand = document.getElementById('brand');
                brand.classList.add('animate-text');
            }, 2000);

            // Ir para o login após 5 segundos
            setTimeout(() => go('login'), 5500);
        }

        // 2. TELA DE LOGIN (FACEBOOK LITE STYLE)
        function renderLogin() {
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-black">
                    <h1 class="text-[#FFD700] text-3xl font-black italic mb-10">Word Music Lite</h1>
                    <div class="w-full max-w-sm space-y-4">
                        <input type="text" placeholder="E-mail ou telemóvel" class="w-full bg-fb-card p-4 rounded-md border fb-border outline-none text-white focus:border-[#D32F2F]">
                        <input type="password" placeholder="Palavra-passe" class="w-full bg-fb-card p-4 rounded-md border fb-border outline-none text-white focus:border-[#D32F2F]">
                        <button onclick="go('home')" class="w-full bg-[#D32F2F] text-white font-bold py-3 rounded-md text-lg active:scale-95 transition-all shadow-lg">Entrar</button>
                        
                        <div class="text-center py-2">
                            <a href="#" class="text-blue-500 text-sm">Esqueceu-se da palavra-passe?</a>
                        </div>
                        
                        <div class="flex items-center space-x-2 py-4">
                            <div class="h-[1px] bg-zinc-800 w-full"></div>
                            <span class="text-zinc-600 italic">ou</span>
                            <div class="h-[1px] bg-zinc-800 w-full"></div>
                        </div>

                        <button class="w-full bg-green-700 text-white font-bold py-2 rounded-md max-w-[220px] mx-auto block">Criar nova conta</button>
                    </div>
                </div>
            `;
        }

        // 3. FEED (FACEBOOK LITE STYLE)
        function renderHome() {
            app.innerHTML = `
                <div class="bg-black min-h-screen pb-20">
                    <!-- Nav -->
                    <nav class="sticky top-0 bg-fb-card border-b fb-border flex justify-around p-1 z-50">
                        <button class="p-3 text-red-600 border-b-2 border-red-600">🏠</button>
                        <button class="p-3 text-zinc-500">👥</button>
                        <button class="p-3 text-zinc-500">🎞️</button>
                        <button class="p-3 text-zinc-500">🔔</button>
                        <button class="p-3 text-zinc-500">☰</button>
                    </nav>

                    <!-- Status -->
                    <div class="bg-fb-card p-4 mt-2 flex items-center space-x-3">
                        <div class="w-10 h-10 bg-red-900 rounded-full flex items-center justify-center font-bold">7V</div>
                        <div class="bg-black text-zinc-500 rounded-full px-4 py-2 w-full text-sm border fb-border">
                            O que vais gravar hoje?
                        </div>
                    </div>
                    
                    <div class="bg-fb-card flex border-t fb-border py-2 text-[10px] font-bold">
                        <button class="flex-1 text-red-500">📷 IMAGEM</button>
                        <button class="flex-1 text-[#FFD700]">🎵 ÁUDIO</button>
                        <button class="flex-1 text-blue-500">🎥 VÍDEO</button>
                    </div>

                    <!-- FEED -->
                    <div class="mt-2 space-y-2">
                        ${PostCard("Sete Vidas", "Bem-vindos ao Word Music Lite! A maior rede de músicos de Moçambique 🇲🇿", "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400")}
                        ${PostCard("Jackson Beatz", "Produtores de Nampula, vamos nos unir?", null)}
                    </div>
                </div>
            `;
        }

        function PostCard(name, text, img) {
            return `
                <div class="bg-fb-card p-4">
                    <div class="flex items-center space-x-2 mb-3">
                        <div class="w-10 h-10 bg-zinc-800 rounded-full border border-zinc-700"></div>
                        <div>
                            <p class="font-bold text-sm text-[#FFD700]">${name}</p>
                            <p class="text-zinc-600 text-[10px]">Agora mesmo • Moçambique</p>
                        </div>
                    </div>
                    <p class="text-sm mb-4">${text}</p>
                    ${img ? `<img src="${img}" class="w-full rounded-md mb-4 border fb-border">` : ''}
                    <div class="flex justify-between border-t fb-border pt-3 text-zinc-400 text-xs">
                        <button>🔥 Curtir</button>
                        <button>💬 Comentar</button>
                        <button>🚀 Partilhar</button>
                    </div>
                </div>
            `;
        }

        // Iniciar
        go('splash');
    </script>
</body>
</html>
