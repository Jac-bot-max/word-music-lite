<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Word Music Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animação de Escrita Mágica e Giro */
        @keyframes magicWriting {
            0% { width: 0; opacity: 0; transform: rotateY(90deg); filter: blur(5px); }
            50% { width: 100%; opacity: 1; transform: rotateY(180deg); filter: blur(0px); }
            100% { width: 100%; opacity: 1; transform: rotateY(360deg); text-shadow: 0 0 20px #FFD700; }
        }
        
        .magic-text {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #FFD700;
            animation: magicWriting 3s ease-in-out forwards;
        }

        .bg-fb-dark { background-color: #000000; }
        .bg-fb-card { background-color: #1c1c1c; }
        .text-gold { color: #FFD700; }
        .btn-red { background-color: #D32F2F; }
    </style>
</head>
<body class="bg-fb-dark text-white font-sans overflow-x-hidden">

    <div id="app">
        <!-- O conteúdo será injetado aqui pelo JavaScript abaixo -->
    </div>

    <script>
        const app = document.getElementById('app');

        // FUNÇÃO PARA MUDAR DE PÁGINA
        function go(page) {
            if (page === 'splash') renderSplash();
            if (page === 'login') renderLogin();
            if (page === 'home') renderHome();
            window.scrollTo(0,0);
        }

        // 1. TELA DE ABERTURA (SPLASH)
        function renderSplash() {
            app.innerHTML = `
                <div class="fixed inset-0 bg-black flex flex-col items-center justify-center z-[999]">
                    <div class="relative">
                        <h1 class="magic-text text-4xl font-black italic text-gold">@7viDAS</h1>
                    </div>
                    <p class="text-red-600 tracking-[5px] text-[10px] mt-4 opacity-70">SETE VIDAS MUSIC</p>
                </div>
            `;
            setTimeout(() => go('login'), 4000);
        }

        // 2. TELA DE LOGIN (ESTILO FB LITE)
        function renderLogin() {
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-black">
                    <h1 class="text-gold text-3xl font-black italic mb-8">Word Music Lite</h1>
                    <div class="w-full max-w-sm space-y-3">
                        <input type="text" placeholder="Telemóvel ou e-mail" class="w-full bg-fb-card p-3 rounded-md border border-zinc-800 outline-none text-sm">
                        <input type="password" placeholder="Palavra-passe" class="w-full bg-fb-card p-3 rounded-md border border-zinc-800 outline-none text-sm">
                        <button onclick="go('home')" class="w-full btn-red py-2.5 rounded-md font-bold text-white shadow-lg">Entrar</button>
                        <p class="text-center text-blue-500 text-xs py-2">Esqueceu-se da palavra-passe?</p>
                        <hr class="border-zinc-800">
                        <button class="w-full bg-green-700 py-2 rounded-md font-bold text-sm text-white mx-auto block max-w-[200px]">Criar nova conta</button>
                    </div>
                </div>
            `;
        }

        // 3. PÁGINA INICIAL (FEED ESTILO FACEBOOK LITE)
        function renderHome() {
            app.innerHTML = `
                <div class="pb-20 bg-black min-h-screen">
                    <!-- Nav Bar -->
                    <nav class="sticky top-0 bg-fb-card border-b border-zinc-800 flex justify-around p-1 z-50">
                        <button class="p-2 text-red-600 border-b-2 border-red-600 flex-1 flex justify-center">🏠</button>
                        <button class="p-2 text-zinc-500 flex-1 flex justify-center">👥</button>
                        <button class="p-2 text-zinc-500 flex-1 flex justify-center text-xl">🎞️</button>
                        <button class="p-2 text-zinc-500 flex-1 flex justify-center">🔔</button>
                        <button class="p-2 text-zinc-500 flex-1 flex justify-center">☰</button>
                    </nav>

                    <!-- Status Post -->
                    <div class="bg-fb-card p-3 mt-2 flex items-center space-x-3">
                        <div class="w-10 h-10 bg-red-900 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-xs">7V</div>
                        <div class="bg-black text-zinc-500 rounded-full px-4 py-2 w-full text-sm border border-zinc-800">
                            O que estás a gravar agora?
                        </div>
                    </div>
                    <div class="bg-fb-card flex border-t border-zinc-800 py-2">
                        <button class="flex-1 text-[10px] text-red-500 font-bold border-r border-zinc-800">📷 IMAGEM</button>
                        <button class="flex-1 text-[10px] text-gold font-bold border-r border-zinc-800">🎵 ÁUDIO</button>
                        <button class="flex-1 text-[10px] text-blue-500 font-bold">🎥 VÍDEO</button>
                    </div>

                    <!-- FEED -->
                    <div class="mt-2 space-y-2">
                        ${Post("Sete Vidas Music", "A preparar o próximo hit para o Word Music! 🇲🇿", "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=400&q=80")}
                        ${Post("Jackson Beatz", "Nampula na casa! Quem quer beats novos?", null)}
                    </div>
                </div>
            `;
        }

        function Post(user, text, img) {
            return `
                <div class="bg-fb-card p-4">
                    <div class="flex items-center space-x-2 mb-3">
                        <div class="w-9 h-9 bg-zinc-700 rounded-full"></div>
                        <div>
                            <p class="font-bold text-sm text-gold">${user}</p>
                            <p class="text-zinc-500 text-[10px]">Justamente agora • Moçambique</p>
                        </div>
                    </div>
                    <p class="text-sm mb-3">${text}</p>
                    ${img ? `<img src="${img}" class="w-full rounded-sm border border-zinc-800 mb-3">` : ''}
                    <div class="flex justify-between border-t border-zinc-800 pt-3 text-zinc-400 text-xs font-bold">
                        <button class="flex items-center space-x-1"><span>🔥</span> <span>Curte</span></button>
                        <button class="flex items-center space-x-1"><span>💬</span> <span>Comenta</span></button>
                        <button class="flex items-center space-x-1"><span>🚀</span> <span>Partilha</span></button>
                    </div>
                </div>
            `;
        }

        // INICIAR O SITE
        go('splash');
    </script>
</body>
</html>
