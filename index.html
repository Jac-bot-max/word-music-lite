<style>
    @keyframes giro-escrita {
        0% { transform: rotateY(0deg) scale(0.5); opacity: 0; filter: blur(10px); }
        50% { transform: rotateY(180deg) scale(1.1); opacity: 1; filter: blur(0px); }
        100% { transform: rotateY(360deg) scale(1); opacity: 1; }
    }
    
    @keyframes linha-magica {
        0% { width: 0%; opacity: 0; }
        100% { width: 80%; opacity: 1; }
    }

    .animate-giro-escrita {
        animation: giro-escrita 3.5s ease-in-out forwards;
    }

    .animate-linha-magica {
        animation: linha-magica 2s ease-in-out forwards 1.5s;
    }
</style>
